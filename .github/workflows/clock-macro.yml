name: Clock — macro (WW-STATE)

# ORCH-01 / IMP-07 — the macro clock, on its real 12h cadence
# (quant-infra/orch/clocks/three_clocks.py's MACRO_CLOCK). Runs
# `scripts/run_clock.py macro`, which:
#   - checks the REAL MarketHoursGate (macro does NOT require market hours —
#     it describes the world 24/7, not one venue's session — so this gate
#     always allows it; run_clock.py still consults it for real, it just
#     never refuses this particular clock),
#   - checks ops/clock_runs/macro.jsonl for idempotent replay (skips if the
#     clock already ran successfully inside its current 12h window),
#   - and, if allowed to run, invokes the real engine.incepta.export_state
#     export, writing public/data/state/latest.json.
#
# GitHub Actions scheduled workflows only fire once this file exists on the
# repository's DEFAULT branch — see SCHEDULING.md for what merging this
# actually requires, and why that cannot be verified from this sandbox
# (no GitHub access here).

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours, UTC — see SCHEDULING.md's honest
      # caveat: GitHub does not guarantee scheduled workflows fire exactly
      # on time, only "as close to that time as possible."
  workflow_dispatch: {} # manual trigger from the Actions tab

concurrency:
  group: clock-macro
  cancel-in-progress: false # overlapping runs queue rather than race

permissions:
  contents: write # needed to commit/push the export + run-log back to the branch

jobs:
  run-macro-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # engine/ (incepta) — what export_state.py itself needs.
          pip install -r engine/requirements.txt
          # quant-infra/orch and data-router are separate sealed packages
          # with no requirements.txt of their own (see SCHEDULING.md) —
          # scripts/run_clock.py's own market-hours-gate import chain
          # (scheduler.py -> networkx, data-router's calendar module ->
          # pandas) is declared here explicitly. pandas already comes from
          # engine/requirements.txt above; networkx does not.
          pip install networkx

      - name: Run the macro clock
        run: python scripts/run_clock.py macro

      - name: Commit and push any changed exports / run log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/state ops/clock_runs
          if git diff --cached --quiet; then
            echo "No changes to commit (clean skip or no-op run)."
          else
            git commit -m "chore(clock): macro run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
